<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="shadowBox" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=JetBrains+Mono:wght@700&amp;display=swap');
    text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" fill="#ffffff" />
  <rect width="1200" height="6" fill="#0284c7" />

  <!-- Top Title -->
  <g transform="translate(60, 50)">
    <rect width="250" height="34" rx="17" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" />
    <text x="125" y="23" fill="#0284c7" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1">ETHICAL DATA PROTOCOL</text>
    <text x="0" y="75" fill="#0f172a" font-size="34" font-weight="800">Sales Navigator Compliant Prospecting Architecture</text>
  </g>

  <!-- 2 Big Columns -->
  <g transform="translate(60, 155)">
    
    <!-- Left Column: Core Workflow -->
    <g transform="translate(0, 0)">
      <rect width="520" height="390" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowBox)" />
      <rect width="520" height="8" rx="4" fill="#0284c7" />

      <text x="35" y="45" fill="#0f172a" font-size="24" font-weight="800">List Configuration Protocol</text>
      
      <!-- Step 1 -->
      <g transform="translate(35, 75)">
        <rect width="450" height="68" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
        <circle cx="35" cy="34" r="18" fill="#eff6ff" />
        <text x="35" y="41" fill="#0284c7" font-size="16" font-weight="800" text-anchor="middle">1</text>
        <text x="70" y="30" fill="#0f172a" font-size="17" font-weight="800">Filter ICP Search Targets</text>
        <text x="70" y="52" fill="#64748b" font-size="14" font-weight="600">Geo, Company Headcount &amp; Job Seniority</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(35, 160)">
        <rect width="450" height="68" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
        <circle cx="35" cy="34" r="18" fill="#eff6ff" />
        <text x="35" y="41" fill="#0284c7" font-size="16" font-weight="800" text-anchor="middle">2</text>
        <text x="70" y="30" fill="#0f172a" font-size="17" font-weight="800">Export Public Metadata</text>
        <text x="70" y="52" fill="#64748b" font-size="14" font-weight="600">Executive Names, Titles &amp; Corporate Domains</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(35, 245)">
        <rect width="450" height="68" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
        <circle cx="35" cy="34" r="18" fill="#eff6ff" />
        <text x="35" y="41" fill="#0284c7" font-size="16" font-weight="800" text-anchor="middle">3</text>
        <text x="70" y="30" fill="#0f172a" font-size="17" font-weight="800">Normalize &amp; Verify Contacts</text>
        <text x="70" y="52" fill="#64748b" font-size="14" font-weight="600">Automated Google Sheets RegEx &amp; SMTP Check</text>
      </g>

      <rect x="35" y="330" width="450" height="42" rx="8" fill="#ecfdf5" stroke="#a7f3d0" />
      <text x="260" y="356" fill="#047857" font-size="15" font-weight="800" text-anchor="middle">✓ 100% Policy-Safe &amp; Sustainable</text>
    </g>

    <!-- Right Column: Standard JSON Schema -->
    <g transform="translate(560, 0)">
      <rect width="520" height="390" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowBox)" />
      <rect width="520" height="8" rx="4" fill="#10b981" />

      <text x="35" y="45" fill="#0f172a" font-size="24" font-weight="800">Clean Outbound JSON Schema</text>

      <g transform="translate(35, 75)">
        <rect width="450" height="238" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
        
        <text x="25" y="40" fill="#0f172a" font-size="16" font-weight="700" class="mono">{</text>
        <text x="45" y="70" fill="#2563eb" font-size="16" class="mono">"event": <tspan fill="#0f172a">"lead_ingested"</tspan>,</text>
        <text x="45" y="100" fill="#2563eb" font-size="16" class="mono">"source": <tspan fill="#0f172a">"sales_nav_verified"</tspan>,</text>
        <text x="45" y="130" fill="#2563eb" font-size="16" class="mono">"lead_data": {</text>
        <text x="70" y="160" fill="#7c3aed" font-size="16" class="mono">"name": <tspan fill="#0f172a">"Greg Williams"</tspan>,</text>
        <text x="70" y="190" fill="#7c3aed" font-size="16" class="mono">"company": <tspan fill="#0f172a">"Apex Freight"</tspan>,</text>
        <text x="70" y="220" fill="#7c3aed" font-size="16" class="mono">"title": <tspan fill="#047857">"VP of Supply Chain"</tspan></text>
        <text x="45" y="245" fill="#2563eb" font-size="16" class="mono">}</text>
        <text x="25" y="265" fill="#0f172a" font-size="16" font-weight="700" class="mono">}</text>
      </g>

      <rect x="35" y="330" width="450" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="260" y="356" fill="#1d4ed8" font-size="15" font-weight="800" text-anchor="middle">✓ Direct Ingestion for HubSpot &amp; Salesforce</text>
    </g>

  </g>

  <!-- Footer -->
  <g transform="translate(60, 585)">
    <text x="0" y="0" fill="#64748b" font-size="14" font-weight="700">Willay Haider • Outbound Sales Architecture</text>
    <text x="1080" y="0" fill="#0284c7" font-size="14" font-weight="800" text-anchor="end">willayhaider.pro</text>
  </g>
</svg>
