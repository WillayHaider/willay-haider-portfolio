<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="whiteGuideShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
    text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>

  <!-- Background Canvas: Clean Crisp White -->
  <rect width="1200" height="630" fill="#ffffff" />
  <rect width="1200" height="4" fill="#0284c7" />

  <!-- Outer Window -->
  <g transform="translate(40, 35)">
    <rect width="1120" height="540" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#whiteGuideShadow)" />

    <!-- App Header Bar -->
    <rect width="1120" height="56" rx="14" fill="#f8fafc" />
    <rect y="42" width="1120" height="14" fill="#f8fafc" />
    <line x1="0" y1="56" x2="1120" y2="56" stroke="#e2e8f0" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="28" cy="28" r="6" fill="#cbd5e1" />
    <circle cx="48" cy="28" r="6" fill="#cbd5e1" />
    <circle cx="68" cy="28" r="6" fill="#cbd5e1" />

    <text x="100" y="34" fill="#0f172a" font-size="14" font-weight="700">LinkedIn Sales Navigator • Ethical Lead List Building &amp; Export Protocol</text>
    <rect x="910" y="14" width="180" height="28" rx="6" fill="#ecfdf5" stroke="#a7f3d0" />
    <text x="1000" y="32" fill="#047857" font-size="11" font-weight="700" text-anchor="middle">✓ 100% Policy Compliant</text>

    <!-- 2 Column Layout Inside -->
    <g transform="translate(25, 75)">
      
      <!-- Left Column: Step-by-Step Ethical Export Setup -->
      <g transform="translate(0, 0)">
        <rect width="520" height="425" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
        <rect width="520" height="4" rx="2" fill="#0284c7" />
        
        <text x="24" y="34" fill="#0f172a" font-size="16" font-weight="700">Official List Building &amp; Export Steps</text>
        <text x="24" y="54" fill="#64748b" font-size="12" font-weight="600">ZERO EXTENSION RISK • COMPLIANT PROSPECTING</text>

        <!-- Step Item 1 -->
        <g transform="translate(20, 75)">
          <rect width="480" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" />
          <circle cx="28" cy="30" r="14" fill="#eff6ff" />
          <text x="28" y="35" fill="#1d4ed8" font-size="12" font-weight="800" text-anchor="middle">1</text>
          <text x="56" y="26" fill="#0f172a" font-size="13" font-weight="700">Build Saved ICP Account Lists</text>
          <text x="56" y="46" fill="#64748b" font-size="11">Filter by Geography, Verified Headcount &amp; Industry</text>
        </g>

        <!-- Step Item 2 -->
        <g transform="translate(20, 145)">
          <rect width="480" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" />
          <circle cx="28" cy="30" r="14" fill="#eff6ff" />
          <text x="28" y="35" fill="#1d4ed8" font-size="12" font-weight="800" text-anchor="middle">2</text>
          <text x="56" y="26" fill="#0f172a" font-size="13" font-weight="700">Export Public Company &amp; Contact Metadata</text>
          <text x="56" y="46" fill="#64748b" font-size="11">Extract full names, executive titles, and corporate domains</text>
        </g>

        <!-- Step Item 3 -->
        <g transform="translate(20, 215)">
          <rect width="480" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" />
          <circle cx="28" cy="30" r="14" fill="#eff6ff" />
          <text x="28" y="35" fill="#1d4ed8" font-size="12" font-weight="800" text-anchor="middle">3</text>
          <text x="56" y="26" fill="#0f172a" font-size="13" font-weight="700">Normalize via Automated Google Sheets Formula</text>
          <text x="56" y="46" fill="#64748b" font-size="11">Clean legal entities ("LLC", "Inc") with standard RegEx</text>
        </g>

        <!-- Step Item 4 -->
        <g transform="translate(20, 285)">
          <rect width="480" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" />
          <circle cx="28" cy="30" r="14" fill="#eff6ff" />
          <text x="28" y="35" fill="#1d4ed8" font-size="12" font-weight="800" text-anchor="middle">4</text>
          <text x="56" y="26" fill="#0f172a" font-size="13" font-weight="700">Verified Email &amp; Phone Append</text>
          <text x="56" y="46" fill="#64748b" font-size="11">Validate MX records &amp; DNC status before enrolling in cadences</text>
        </g>

        <rect x="20" y="360" width="480" height="42" rx="6" fill="#ecfdf5" stroke="#a7f3d0" />
        <text x="260" y="386" fill="#047857" font-size="12" font-weight="700" text-anchor="middle">✓ Protects LinkedIn Account Longevity &amp; Reputation</text>
      </g>

      <!-- Right Column: Code & Data Schema Box -->
      <g transform="translate(550, 0)">
        <rect width="520" height="425" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
        <rect width="520" height="4" rx="2" fill="#10b981" />
        
        <text x="24" y="34" fill="#0f172a" font-size="16" font-weight="700">Standardized Outbound Lead Schema</text>
        <text x="24" y="54" fill="#64748b" font-size="12" font-weight="600">CLEAN JSON STRUCTURE FOR CRM INGESTION</text>

        <g transform="translate(20, 75)">
          <rect width="480" height="265" rx="8" fill="#ffffff" stroke="#e2e8f0" />
          <text x="20" y="35" fill="#047857" font-size="12" font-weight="700" class="mono">{</text>
          <text x="40" y="60" fill="#2563eb" font-size="12" class="mono">"event": <tspan fill="#0f172a">"lead_ingested"</tspan>,</text>
          <text x="40" y="85" fill="#2563eb" font-size="12" class="mono">"source": <tspan fill="#0f172a">"sales_nav_verified"</tspan>,</text>
          <text x="40" y="110" fill="#2563eb" font-size="12" class="mono">"lead_data": {</text>
          <text x="60" y="135" fill="#7c3aed" font-size="12" class="mono">"full_name": <tspan fill="#0f172a">"Greg Williams"</tspan>,</text>
          <text x="60" y="160" fill="#7c3aed" font-size="12" class="mono">"company_cleaned": <tspan fill="#0f172a">"Apex Freight"</tspan>,</text>
          <text x="60" y="185" fill="#7c3aed" font-size="12" class="mono">"title": <tspan fill="#0f172a">"VP of Supply Chain"</tspan>,</text>
          <text x="60" y="210" fill="#7c3aed" font-size="12" class="mono">"verified_email": <tspan fill="#047857">"greg@apexfreight.com"</tspan></text>
          <text x="40" y="235" fill="#2563eb" font-size="12" class="mono">}</text>
          <text x="20" y="255" fill="#047857" font-size="12" font-weight="700" class="mono">}</text>
        </g>

        <rect x="20" y="360" width="480" height="42" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
        <text x="260" y="386" fill="#1d4ed8" font-size="12" font-weight="700" text-anchor="middle">✓ Compatible with HubSpot, Salesforce &amp; Zoho CRM</text>
      </g>

    </g>

  </g>
</svg>
