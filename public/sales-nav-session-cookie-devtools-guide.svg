<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="devtoolsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d18" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="cookieCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
    text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#devtoolsBg)" />

  <!-- Top Title -->
  <g transform="translate(60, 45)">
    <rect width="210" height="26" rx="13" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.3" />
    <text x="105" y="17" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">CHROME DEVTOOLS PROTOCOL</text>
    <text x="0" y="58" fill="#ffffff" font-size="26" font-weight="800">Manual Session Cookie Extraction (Bypassing Scraper Detection)</text>
    <text x="0" y="82" fill="#94a3b8" font-size="13" font-weight="500">How to safely extract your 150+ character li_at authentication token in under 20 seconds.</text>
  </g>

  <!-- Mockup DevTools Window -->
  <g transform="translate(60, 150)">
    <rect width="1080" height="420" rx="12" fill="#070c18" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- DevTools Top Tab Bar -->
    <rect width="1080" height="42" rx="12" fill="#0f172a" />
    <circle cx="25" cy="21" r="5" fill="#ef4444" />
    <circle cx="42" cy="21" r="5" fill="#f59e0b" />
    <circle cx="59" cy="21" r="5" fill="#10b981" />

    <text x="100" y="26" fill="#64748b" font-size="12" font-weight="600">Elements</text>
    <text x="180" y="26" fill="#64748b" font-size="12" font-weight="600">Console</text>
    <text x="260" y="26" fill="#64748b" font-size="12" font-weight="600">Sources</text>
    <text x="340" y="26" fill="#64748b" font-size="12" font-weight="600">Network</text>
    
    <!-- Active Application Tab -->
    <rect x="410" y="6" width="115" height="30" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text x="467" y="25" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Application</text>

    <!-- Sidebar Left: Storage Tree -->
    <g transform="translate(20, 60)">
      <rect width="240" height="330" rx="8" fill="#0c1222" stroke="#1e293b" />
      <text x="20" y="30" fill="#94a3b8" font-size="11" font-weight="700">STORAGE</text>
      <text x="30" y="60" fill="#64748b" font-size="12">▶ Local Storage</text>
      <text x="30" y="90" fill="#64748b" font-size="12">▶ Session Storage</text>
      <text x="30" y="120" fill="#64748b" font-size="12">▼ Cookies</text>
      
      <!-- Selected Cookies URL -->
      <rect x="40" y="132" width="180" height="26" rx="4" fill="#2563eb" fill-opacity="0.25" stroke="#3b82f6" stroke-width="1" />
      <text x="50" y="150" fill="#60a5fa" font-size="11" font-weight="700">https://www.linkedin.com</text>
      
      <text x="30" y="190" fill="#64748b" font-size="12">▶ IndexedDB</text>
      <text x="30" y="220" fill="#64748b" font-size="12">▶ Cache storage</text>
    </g>

    <!-- Cookie Table Right -->
    <g transform="translate(280, 60)">
      <rect width="780" height="330" rx="8" fill="#0c1222" stroke="#1e293b" />
      
      <!-- Cookie Table Header -->
      <rect width="780" height="35" rx="8" fill="#131d36" />
      <text x="25" y="22" fill="#94a3b8" font-size="11" font-weight="700">NAME</text>
      <text x="140" y="22" fill="#94a3b8" font-size="11" font-weight="700">VALUE (SESSION TOKEN)</text>
      <text x="580" y="22" fill="#94a3b8" font-size="11" font-weight="700">DOMAIN</text>
      <text x="700" y="22" fill="#94a3b8" font-size="11" font-weight="700">SECURE</text>

      <!-- Row 1: li_at (HIGHLIGHTED) -->
      <g transform="translate(0, 35)">
        <rect width="780" height="50" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1.5" />
        <circle cx="15" cy="25" r="4" fill="#10b981" />
        <text x="25" y="30" fill="#34d399" font-size="13" font-weight="800" class="mono">li_at</text>
        <text x="140" y="30" fill="#ffffff" font-size="12" font-weight="600" class="mono">AQEDASgK8B0Fq9m2AAABk... (150+ chars)</text>
        <text x="580" y="30" fill="#94a3b8" font-size="12" class="mono">.linkedin.com</text>
        <text x="700" y="30" fill="#10b981" font-size="12" font-weight="700">✓ True</text>
      </g>

      <!-- Row 2: JSESSIONID -->
      <g transform="translate(0, 85)">
        <line x1="0" y1="45" x2="780" y2="45" stroke="#1e293b" />
        <text x="25" y="28" fill="#cbd5e1" font-size="12" class="mono">JSESSIONID</text>
        <text x="140" y="28" fill="#64748b" font-size="11" class="mono">"ajax:7492048194028472910"</text>
        <text x="580" y="28" fill="#64748b" font-size="11" class="mono">.www.linkedin.com</text>
        <text x="700" y="28" fill="#10b981" font-size="11">✓ True</text>
      </g>

      <!-- Row 3: bcookie -->
      <g transform="translate(0, 130)">
        <line x1="0" y1="45" x2="780" y2="45" stroke="#1e293b" />
        <text x="25" y="28" fill="#cbd5e1" font-size="12" class="mono">bcookie</text>
        <text x="140" y="28" fill="#64748b" font-size="11" class="mono">"v=2&amp;c4b123984e784532..."</text>
        <text x="580" y="28" fill="#64748b" font-size="11" class="mono">.linkedin.com</text>
        <text x="700" y="28" fill="#10b981" font-size="11">✓ True</text>
      </g>

      <!-- Callout Box inside table -->
      <g transform="translate(25, 200)">
        <rect width="730" height="75" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" />
        <text x="20" y="26" fill="#38bdf8" font-size="12" font-weight="700">SECURITY AUDIT NOTE:</text>
        <text x="20" y="46" fill="#e2e8f0" font-size="11" font-weight="500">Copying `li_at` directly keeps extraction external to the browser sandbox, avoiding DOM-based scraper heuristics.</text>
        <text x="20" y="64" fill="#94a3b8" font-size="11">Never share this token publicly or check it into public GitHub repositories.</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(60, 615)">
    <text x="0" y="20" fill="#64748b" font-size="12" font-weight="600">LinkedIn Sales Navigator Security Architecture • Willay Haider</text>
    <text x="1080" y="20" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="end">willayhaider.pro</text>
  </g>
</svg>
