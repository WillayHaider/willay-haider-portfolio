<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <filter id="shadowCard" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a59" />
      <stop offset="100%" stop-color="#ff5c35" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap');
    text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1200" height="640" fill="#ffffff" />
  <rect width="1200" height="6" fill="url(#orangeGrad)" />

  <!-- Header Section -->
  <g transform="translate(60, 45)">
    <rect width="270" height="32" rx="16" fill="#fff1ed" stroke="#ffd1c2" stroke-width="1.5" />
    <text x="135" y="21" fill="#c43812" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1">HUBSPOT CAMPAIGN GOVERNANCE</text>
    <text x="0" y="70" fill="#0f172a" font-size="30" font-weight="800">Automated 550 Bounce Exclusion Workflow Schema</text>
    <text x="0" y="96" fill="#64748b" font-size="15" font-weight="600">Zero-Tolerance Reputation Protection: Automated Contact Pipeline Disqualification</text>
  </g>

  <!-- 3 Big Logic Stage Cards -->
  <g transform="translate(60, 175)">

    <!-- Card 1: Enrollment Trigger -->
    <g transform="translate(0, 0)">
      <rect width="330" height="365" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowCard)" />
      <rect width="330" height="8" rx="4" fill="#ef4444" />
      
      <circle cx="45" cy="48" r="22" fill="#fef2f2" stroke="#fecaca" stroke-width="2" />
      <text x="45" y="55" fill="#dc2626" font-size="18" font-weight="800" text-anchor="middle">⚡</text>
      
      <text x="45" y="112" fill="#0f172a" font-size="22" font-weight="800">Enrollment Trigger</text>
      <text x="45" y="138" fill="#64748b" font-size="14" font-weight="600">Real-Time Bounce Detection</text>

      <rect x="20" y="165" width="290" height="115" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="35" y="196" fill="#1e293b" font-size="13" font-weight="700">• Email Bounce Reason contains "550"</text>
      <text x="35" y="226" fill="#1e293b" font-size="13" font-weight="700">• OR SMTP Error is "5.1.1 / 5.7.26"</text>
      <text x="35" y="256" fill="#1e293b" font-size="13" font-weight="700">• OR Lead Verification Status = "Dead"</text>

      <rect x="20" y="300" width="290" height="42" rx="8" fill="#fef2f2" />
      <text x="165" y="327" fill="#dc2626" font-size="13" font-weight="800" text-anchor="middle">Instant Pipeline Flag Triggered</text>
    </g>

    <!-- Arrow 1 -->
    <g transform="translate(340, 170)">
      <path d="M0 0 L15 10 L0 20 Z" fill="#94a3b8" />
    </g>

    <!-- Card 2: Automated Actions -->
    <g transform="translate(365, 0)">
      <rect width="330" height="365" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowCard)" />
      <rect width="330" height="8" rx="4" fill="#f59e0b" />
      
      <circle cx="45" cy="48" r="22" fill="#fffbeb" stroke="#fde68a" stroke-width="2" />
      <text x="45" y="55" fill="#d97706" font-size="18" font-weight="800" text-anchor="middle">⚙️</text>
      
      <text x="45" y="112" fill="#0f172a" font-size="22" font-weight="800">Automated Actions</text>
      <text x="45" y="138" fill="#64748b" font-size="14" font-weight="600">Immediate Circuit Breaker</text>

      <rect x="20" y="165" width="290" height="115" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="35" y="196" fill="#1e293b" font-size="13" font-weight="700">• Unenroll from Active Sequence</text>
      <text x="35" y="226" fill="#1e293b" font-size="13" font-weight="700">• Set Property: Lead Status = Invalid</text>
      <text x="35" y="256" fill="#1e293b" font-size="13" font-weight="700">• Add to Master Suppression List</text>

      <rect x="20" y="300" width="290" height="42" rx="8" fill="#fffbeb" />
      <text x="165" y="327" fill="#b45309" font-size="13" font-weight="800" text-anchor="middle">Sequencing Halted Instantly</text>
    </g>

    <!-- Arrow 2 -->
    <g transform="translate(705, 170)">
      <path d="M0 0 L15 10 L0 20 Z" fill="#94a3b8" />
    </g>

    <!-- Card 3: Deliverability Outcome -->
    <g transform="translate(730, 0)">
      <rect width="350" height="365" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowCard)" />
      <rect width="350" height="8" rx="4" fill="#10b981" />
      
      <circle cx="45" cy="48" r="22" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2" />
      <text x="45" y="55" fill="#047857" font-size="18" font-weight="800" text-anchor="middle">✓</text>
      
      <text x="45" y="112" fill="#0f172a" font-size="22" font-weight="800">Domain Protection</text>
      <text x="45" y="138" fill="#64748b" font-size="14" font-weight="600">Safe Unit Economics</text>

      <rect x="20" y="165" width="310" height="115" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="35" y="196" fill="#1e293b" font-size="13" font-weight="700">• Zero Retries on Dead Addresses</text>
      <text x="35" y="226" fill="#1e293b" font-size="13" font-weight="700">• Hard Bounce Rate Locked &lt; 1.5%</text>
      <text x="35" y="256" fill="#1e293b" font-size="13" font-weight="700">• Google Postmaster Rating = HIGH</text>

      <rect x="20" y="300" width="310" height="42" rx="8" fill="#ecfdf5" />
      <text x="175" y="327" fill="#047857" font-size="13" font-weight="800" text-anchor="middle">Secondary Domains Secured</text>
    </g>

  </g>

  <!-- Footer Branding -->
  <g transform="translate(60, 595)">
    <text x="0" y="0" fill="#64748b" font-size="13" font-weight="700">Willay Haider • HubSpot CRM &amp; RevOps Integration Architecture</text>
    <text x="1080" y="0" fill="#2563eb" font-size="13" font-weight="800" text-anchor="end">willayhaider.pro</text>
  </g>
</svg>
