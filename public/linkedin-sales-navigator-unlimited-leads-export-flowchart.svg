    <g transform="translate(834, 0)">
      <rect width="245" height="360" rx="12" fill="url(#whiteCardGrad)" stroke="#e2e8f0" stroke-width="1.5" filter="url(#subtleShadow)" />
      <rect width="245" height="5" rx="2.5" fill="#f59e0b" />
      <circle cx="36" cy="40" r="16" fill="#fffbeb" stroke="#fde68a" />
      <text x="36" y="45" fill="#b45309" font-size="13" font-weight="800" text-anchor="middle">4</text>
      
      <text x="64" y="44" fill="#0f172a" font-size="15" font-weight="700">CRM Enrichment</text>
