      <rect width="250" height="8" rx="4" fill="#10b981" />
      
      <circle cx="50" cy="55" r="24" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2" />
      <text x="50" y="63" fill="#047857" font-size="20" font-weight="800" text-anchor="middle">2</text>
      
      <text x="50" y="125" fill="#0f172a" font-size="24" font-weight="800">Export Data</text>
