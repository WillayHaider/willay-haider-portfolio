      <text x="30" y="150" fill="#334155" font-size="11" font-weight="600">• SMTP MX Validation</text>
      <text x="30" y="175" fill="#334155" font-size="11" font-weight="600">• DNC Scrubbing Gate</text>
      <text x="30" y="200" fill="#334155" font-size="11" font-weight="600">• SDR Phone Cadence</text>
      <text x="30" y="235" fill="#d97706" font-size="11" font-weight="700">Multi-Channel Outbound</text>
      <text x="30" y="255" fill="#64748b" font-size="10">High conversion velocity</text>

      <rect x="20" y="295" width="205" height="42" rx="6" fill="#fffbeb" stroke="#fde68a" />
      <text x="122" y="321" fill="#b45309" font-size="11" font-weight="700" text-anchor="middle">✓ Pipeline Ready</text>
    </g>

  </g>

  <!-- Footer Info -->
  <g transform="translate(60, 580)">
    <text x="0" y="0" fill="#64748b" font-size="12" font-weight="600">Ethical B2B Outbound Lead Generation &amp; Data Pipeline • Willay Haider</text>
    <text x="1080" y="0" fill="#2563eb" font-size="12" font-weight="700" text-anchor="end">willayhaider.pro</text>
  </g>
</svg>
