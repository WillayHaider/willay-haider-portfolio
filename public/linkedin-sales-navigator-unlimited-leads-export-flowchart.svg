      <circle cx="36" cy="40" r="16" fill="#eff6ff" stroke="#93c5fd" />
      <text x="36" y="45" fill="#1d4ed8" font-size="13" font-weight="800" text-anchor="middle">1</text>
      
      <text x="64" y="44" fill="#0f172a" font-size="15" font-weight="700">ICP Search Filter</text>
      <text x="20" y="85" fill="#475569" font-size="12" font-weight="600">DEFINE TARGET LIST</text>
      
      <rect x="20" y="98" width="205" height="185" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="30" y="125" fill="#334155" font-size="11" font-weight="600">• Geography: US, UK, CA</text>
      <text x="30" y="150" fill="#334155" font-size="11" font-weight="600">• Headcount: 51-500</text>
      <text x="30" y="175" fill="#334155" font-size="11" font-weight="600">• Seniority: VP, CXO, Director</text>
      <text x="30" y="200" fill="#334155" font-size="11" font-weight="600">• Industry: B2B SaaS, Logistics</text>
      <text x="30" y="235" fill="#2563eb" font-size="11" font-weight="700">Save Search Target</text>
      <text x="30" y="255" fill="#64748b" font-size="10">Zero-risk filter parameters</text>

      <rect x="20" y="295" width="205" height="42" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="122" y="321" fill="#1d4ed8" font-size="11" font-weight="700" text-anchor="middle">✓ 100% Policy Compliant</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <g transform="translate(252, 170)">
      <path d="M 0 0 L 18 0 M 12 -6 L 18 0 L 12 6" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Step 2 -->
    <g transform="translate(278, 0)">
      <rect width="245" height="360" rx="12" fill="url(#whiteCardGrad)" stroke="#e2e8f0" stroke-width="1.5" filter="url(#subtleShadow)" />
      <rect width="245" height="5" rx="2.5" fill="#10b981" />
