<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="100%" height="100%" style="background:#FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Header -->
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="170" height="28" rx="14" fill="#EFF6FF" />
    <text x="85" y="19" text-anchor="middle" font-size="13" font-weight="800" fill="#2563EB" letter-spacing="0.5">OBJECTION MATRIX</text>
    <text x="0" y="66" font-size="30" font-weight="900" fill="#0F172A">Founder Objection Response Framework</text>
    <text x="0" y="94" font-size="16" font-weight="600" fill="#64748B">How to pivot the 3 most common startup founder brush-offs into booked meetings</text>
  </g>

  <!-- 3 Stacked High-Legibility Cards -->
  <g transform="translate(40, 140)">
    <!-- Objection 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="880" height="140" rx="14" fill="#F8FAFC" />
      
      <!-- Objection Box -->
      <rect x="16" y="16" width="220" height="108" rx="10" fill="#FFFFFF" />
      <text x="30" y="42" font-size="11" font-weight="800" fill="#64748B" letter-spacing="0.5">OBJECTION 01</text>
      <text x="30" y="66" font-size="15" font-weight="800" fill="#0F172A">&quot;Just send an email,</text>
      <text x="30" y="88" font-size="15" font-weight="800" fill="#0F172A">I'm busy now.&quot;</text>
      <text x="30" y="110" font-size="11" font-weight="700" fill="#EF4444">&#x2715; 90% hang-up reflex</text>

      <!-- Amateur vs Pro -->
      <rect x="250" y="16" width="295" height="108" rx="10" fill="#FEF2F2" />
      <text x="264" y="38" font-size="11" font-weight="800" fill="#991B1B">AMATEUR RESPONSE (HANG-UP):</text>
      <text x="264" y="62" font-size="13" font-weight="600" fill="#7F1D1D">&quot;Sure! What's your email? I'll send</text>
      <text x="264" y="82" font-size="13" font-weight="600" fill="#7F1D1D">our full 20-page agency deck</text>
      <text x="264" y="102" font-size="13" font-weight="600" fill="#7F1D1D">and case studies right over.&quot;</text>

      <rect x="560" y="16" width="304" height="108" rx="10" fill="#F0FDF4" />
      <text x="574" y="38" font-size="11" font-weight="800" fill="#15803D">&#x2713; PRACTITIONER PIVOT (CONVERTS):</text>
      <text x="574" y="62" font-size="13" font-weight="700" fill="#166534">&quot;Happy to send it, but I won't clutter</text>
      <text x="574" y="82" font-size="13" font-weight="700" fill="#166534">your inbox. Are you focused on paid</text>
      <text x="574" y="102" font-size="13" font-weight="700" fill="#166534">ads or SEO pipeline this quarter?&quot;</text>
    </g>

    <!-- Objection 2 -->
    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="880" height="140" rx="14" fill="#F8FAFC" />
      
      <!-- Objection Box -->
      <rect x="16" y="16" width="220" height="108" rx="10" fill="#FFFFFF" />
      <text x="30" y="42" font-size="11" font-weight="800" fill="#64748B" letter-spacing="0.5">OBJECTION 02</text>
      <text x="30" y="66" font-size="15" font-weight="800" fill="#0F172A">&quot;We do marketing</text>
      <text x="30" y="88" font-size="15" font-weight="800" fill="#0F172A">in-house.&quot;</text>
      <text x="30" y="110" font-size="11" font-weight="700" fill="#EF4444">&#x2715; Defensive brush-off</text>

      <!-- Amateur vs Pro -->
      <rect x="250" y="16" width="295" height="108" rx="10" fill="#FEF2F2" />
      <text x="264" y="38" font-size="11" font-weight="800" fill="#991B1B">AMATEUR RESPONSE (COMBATIVE):</text>
      <text x="264" y="62" font-size="13" font-weight="600" fill="#7F1D1D">&quot;Our agency has better tools and</text>
      <text x="264" y="82" font-size="13" font-weight="600" fill="#7F1D1D">more experience than in-house</text>
      <text x="264" y="102" font-size="13" font-weight="600" fill="#7F1D1D">teams. Let me prove it to you.&quot;</text>

      <rect x="560" y="16" width="304" height="108" rx="10" fill="#F0FDF4" />
      <text x="574" y="38" font-size="11" font-weight="800" fill="#15803D">&#x2713; PRACTITIONER PIVOT (COLLABORATIVE):</text>
      <text x="574" y="62" font-size="13" font-weight="700" fill="#166534">&quot;Makes total sense. We don't replace</text>
      <text x="574" y="82" font-size="13" font-weight="700" fill="#166534">internal marketers: we act as your</text>
      <text x="574" y="102" font-size="13" font-weight="700" fill="#166534">outbound arm booking vetted demos.&quot;</text>
    </g>

    <!-- Objection 3 -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="880" height="140" rx="14" fill="#F8FAFC" />
      
      <!-- Objection Box -->
      <rect x="16" y="16" width="220" height="108" rx="10" fill="#FFFFFF" />
      <text x="30" y="42" font-size="11" font-weight="800" fill="#64748B" letter-spacing="0.5">OBJECTION 03</text>
      <text x="30" y="66" font-size="15" font-weight="800" fill="#0F172A">&quot;No budget for</text>
      <text x="30" y="88" font-size="15" font-weight="800" fill="#0F172A">marketing now.&quot;</text>
      <text x="30" y="110" font-size="11" font-weight="700" fill="#EF4444">&#x2715; Cash runway protection</text>

      <!-- Amateur vs Pro -->
      <rect x="250" y="16" width="295" height="108" rx="10" fill="#FEF2F2" />
      <text x="264" y="38" font-size="11" font-weight="800" fill="#991B1B">AMATEUR RESPONSE (DESPERATE):</text>
      <text x="264" y="62" font-size="13" font-weight="600" fill="#7F1D1D">&quot;We have flexible discounts and</text>
      <text x="264" y="82" font-size="13" font-weight="600" fill="#7F1D1D">low monthly retainers starting at</text>
      <text x="264" y="102" font-size="13" font-weight="600" fill="#7F1D1D">only $1,500. Can you do that?&quot;</text>

      <rect x="560" y="16" width="304" height="108" rx="10" fill="#F0FDF4" />
      <text x="574" y="38" font-size="11" font-weight="800" fill="#15803D">&#x2713; PRACTITIONER PIVOT (ZERO RISK):</text>
      <text x="574" y="62" font-size="13" font-weight="700" fill="#166534">&quot;Totally get it. Preserving runway is</text>
      <text x="574" y="82" font-size="13" font-weight="700" fill="#166534">key. How about I share our CAC</text>
      <text x="574" y="102" font-size="13" font-weight="700" fill="#166534">playbook so you have it for Q3?&quot;</text>
    </g>
  </g>

  <!-- Footer Signature -->
  <g transform="translate(40, 620)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#64748B">Willay Haider | Senior Outbound Sales Specialist (57,000+ Dials)</text>
    <text x="880" y="0" text-anchor="end" font-size="13" font-weight="800" fill="#2563EB">willayhaider.pro</text>
  </g>
</svg>
