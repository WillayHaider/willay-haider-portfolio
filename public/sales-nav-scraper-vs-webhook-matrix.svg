<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="matrixShadowBig" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap');
    text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" fill="#ffffff" />
  <rect width="1200" height="6" fill="#4f46e5" />

  <!-- Header -->
  <g transform="translate(60, 50)">
    <rect width="210" height="34" rx="17" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" />
    <text x="105" y="23" fill="#4338ca" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1">ARCHITECTURAL AUDIT</text>
    <text x="0" y="75" fill="#0f172a" font-size="34" font-weight="800">Browser Scrapers vs. Compliant RevOps Pipeline</text>
  </g>

  <!-- 2 Big Columns -->
  <g transform="translate(60, 155)">
    
    <!-- Left Column: Risky Extensions -->
    <g transform="translate(0, 0)">
      <rect width="520" height="390" rx="16" fill="#fff5f5" stroke="#fecaca" stroke-width="2" filter="url(#matrixShadowBig)" />
      <rect width="520" height="8" rx="4" fill="#ef4444" />

      <rect x="35" y="30" width="220" height="32" rx="16" fill="#fee2e2" />
      <text x="145" y="52" fill="#dc2626" font-size="13" font-weight="800" text-anchor="middle">❌ RISKY EXTENSIONS</text>
      
      <text x="35" y="95" fill="#0f172a" font-size="22" font-weight="800">Evaboot, PhantomBuster, Scrupp</text>

      <g transform="translate(35, 125)">
        <text x="0" y="25" fill="#dc2626" font-size="20" font-weight="800">• High Cost:</text>
        <text x="140" y="25" fill="#1e293b" font-size="19" font-weight="600">$99 - $299 / month</text>

        <text x="0" y="70" fill="#dc2626" font-size="20" font-weight="800">• Account Risk:</text>
        <text x="155" y="70" fill="#1e293b" font-size="19" font-weight="600">DOM injection flags bots</text>

        <text x="0" y="115" fill="#dc2626" font-size="20" font-weight="800">• Data Quality:</text>
        <text x="155" y="115" fill="#1e293b" font-size="19" font-weight="600">Raw legal suffixes uncleaned</text>

        <text x="0" y="160" fill="#dc2626" font-size="20" font-weight="800">• Policy Status:</text>
        <text x="155" y="160" fill="#1e293b" font-size="19" font-weight="600">Platform rate lockouts</text>
      </g>

      <rect x="35" y="325" width="450" height="42" rx="8" fill="#fee2e2" stroke="#fecaca" />
      <text x="260" y="352" fill="#991b1b" font-size="15" font-weight="800" text-anchor="middle">VERDICT: Fragile &amp; Expensive</text>
    </g>

    <!-- Right Column: Compliant Pipeline -->
    <g transform="translate(560, 0)">
      <rect width="520" height="390" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2" filter="url(#matrixShadowBig)" />
      <rect width="520" height="8" rx="4" fill="#10b981" />

      <rect x="35" y="30" width="220" height="32" rx="16" fill="#dcfce7" />
      <text x="145" y="52" fill="#166534" font-size="13" font-weight="800" text-anchor="middle">✓ COMPLIANT REVOPS</text>
      
      <text x="35" y="95" fill="#0f172a" font-size="22" font-weight="800">Native Export + Google Sheets</text>

      <g transform="translate(35, 125)">
        <text x="0" y="25" fill="#166534" font-size="20" font-weight="800">• Zero Cost:</text>
        <text x="135" y="25" fill="#15803d" font-size="19" font-weight="800">$0.00 / month (Native)</text>

        <text x="0" y="70" fill="#166534" font-size="20" font-weight="800">• Account Risk:</text>
        <text x="155" y="70" fill="#1e293b" font-size="19" font-weight="600">100% Policy compliant</text>

        <text x="0" y="115" fill="#166534" font-size="20" font-weight="800">• Data Quality:</text>
        <text x="155" y="115" fill="#1e293b" font-size="19" font-weight="600">Automated RegEx scrubbed</text>

        <text x="0" y="160" fill="#166534" font-size="20" font-weight="800">• CRM Sync:</text>
        <text x="155" y="160" fill="#1e293b" font-size="19" font-weight="600">Direct HubSpot push</text>
      </g>

      <rect x="35" y="325" width="450" height="42" rx="8" fill="#dcfce7" stroke="#bbf7d0" />
      <text x="260" y="352" fill="#166534" font-size="15" font-weight="800" text-anchor="middle">VERDICT: Production-Grade &amp; Safe</text>
    </g>

  </g>

  <!-- Footer -->
  <g transform="translate(60, 585)">
    <text x="0" y="0" fill="#64748b" font-size="14" font-weight="700">Willay Haider • Outbound Tech Stack Optimization</text>
    <text x="1080" y="0" fill="#4f46e5" font-size="14" font-weight="800" text-anchor="end">willayhaider.pro</text>
  </g>
</svg>
