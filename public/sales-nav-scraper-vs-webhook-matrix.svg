<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="matrixShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
    text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>

  <!-- Background Canvas: Clean Crisp White -->
  <rect width="1200" height="630" fill="#ffffff" />
  <rect width="1200" height="4" fill="#4f46e5" />

  <!-- Top Title -->
  <g transform="translate(60, 45)">
    <rect width="210" height="26" rx="13" fill="#eef2ff" stroke="#c7d2fe" />
    <text x="105" y="17" fill="#4338ca" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">ARCHITECTURAL AUDIT</text>
    <text x="0" y="58" fill="#0f172a" font-size="26" font-weight="800">Paid Browser Scrapers vs. Compliant RevOps Data Pipeline</text>
    <text x="0" y="82" fill="#64748b" font-size="13" font-weight="500">Why top outbound teams adopt clean, compliant data operations over risky third-party extensions.</text>
  </g>

  <!-- 2-Column Comparison Container -->
  <g transform="translate(60, 145)">
    
    <!-- Left Column: Risky Extensions (Light Red Tint) -->
    <g transform="translate(0, 0)">
      <rect width="520" height="395" rx="14" fill="#fff5f5" stroke="#fecaca" stroke-width="1.5" filter="url(#matrixShadow)" />
      <rect width="520" height="5" rx="2.5" fill="#ef4444" />
      
      <rect x="25" y="22" width="220" height="26" rx="13" fill="#fee2e2" />
      <text x="135" y="39" fill="#dc2626" font-size="11" font-weight="700" text-anchor="middle">❌ RISKY THIRD-PARTY EXTENSIONS</text>
      <text x="25" y="75" fill="#0f172a" font-size="16" font-weight="700">Evaboot, PhantomBuster, Scrupp</text>

      <g transform="translate(25, 95)">
        <text x="0" y="20" fill="#dc2626" font-weight="700">• Cost Overhead:</text>
        <text x="140" y="20" fill="#334155" font-size="13">$99 - $299/month recurring fees</text>

        <text x="0" y="55" fill="#dc2626" font-weight="700">• Account Safety:</text>
        <text x="140" y="55" fill="#334155" font-size="13">High risk. DOM injection triggers bot flags</text>

        <text x="0" y="90" fill="#dc2626" font-weight="700">• Data Quality:</text>
        <text x="140" y="90" fill="#334155" font-size="13">Raw legal suffixes ("LLC", "Inc") uncleaned</text>

        <text x="0" y="125" fill="#dc2626" font-weight="700">• CRM Integration:</text>
        <text x="140" y="125" fill="#334155" font-size="13">Manual CSV exports and messy imports</text>

        <text x="0" y="160" fill="#dc2626" font-weight="700">• Policy Risk:</text>
        <text x="140" y="160" fill="#334155" font-size="13">Violates platform terms, causes rate restrictions</text>
      </g>

      <rect x="25" y="325" width="470" height="46" rx="8" fill="#fee2e2" stroke="#fecaca" />
      <text x="260" y="353" fill="#991b1b" font-size="12" font-weight="700" text-anchor="middle">VERDICT: High recurring costs and avoidable account risks.</text>
    </g>

    <!-- Right Column: Compliant RevOps Pipeline (Light Green Tint) -->
    <g transform="translate(560, 0)">
      <rect width="520" height="395" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#matrixShadow)" />
      <rect width="520" height="5" rx="2.5" fill="#10b981" />
      
      <rect x="25" y="22" width="230" height="26" rx="13" fill="#dcfce7" />
      <text x="140" y="39" fill="#166534" font-size="11" font-weight="700" text-anchor="middle">✓ COMPLIANT REVOPS PIPELINE</text>
      <text x="25" y="75" fill="#0f172a" font-size="16" font-weight="700">Native List Export + RegEx Normalization</text>

      <g transform="translate(25, 95)">
        <text x="0" y="20" fill="#166534" font-weight="700">• Cost Overhead:</text>
        <text x="140" y="20" fill="#15803d" font-size="13" font-weight="700">$0.00 Extension Fees (Native Tooling)</text>

        <text x="0" y="55" fill="#166534" font-weight="700">• Account Safety:</text>
        <text x="140" y="55" fill="#334155" font-size="13">100% Policy compliant. Zero DOM tampering</text>

        <text x="0" y="90" fill="#166534" font-weight="700">• Data Quality:</text>
        <text x="140" y="90" fill="#334155" font-size="13">Cleaned automatically via RegEx formulas</text>

        <text x="0" y="125" fill="#166534" font-weight="700">• CRM Integration:</text>
        <text x="140" y="125" fill="#334155" font-size="13">Direct automated push into HubSpot / Sheets</text>

        <text x="0" y="160" fill="#166534" font-weight="700">• Policy Risk:</text>
        <text x="140" y="160" fill="#334155" font-size="13">Zero account strikes, maintains platform safety</text>
      </g>

      <rect x="25" y="325" width="470" height="46" rx="8" fill="#dcfce7" stroke="#bbf7d0" />
      <text x="260" y="353" fill="#166534" font-size="12" font-weight="700" text-anchor="middle">VERDICT: Production-grade, safe, and zero software waste.</text>
    </g>

  </g>

  <!-- Footer -->
  <g transform="translate(60, 580)">
    <text x="0" y="0" fill="#64748b" font-size="12" font-weight="600">Enterprise Outbound Tech Stack Optimization • Willay Haider</text>
    <text x="1080" y="0" fill="#2563eb" font-size="12" font-weight="700" text-anchor="end">willayhaider.pro</text>
  </g>
</svg>
