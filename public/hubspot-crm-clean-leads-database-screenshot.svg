<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="hubspotShadowBig" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap');
    text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" fill="#ffffff" />
  <rect width="1200" height="6" fill="#ff7a59" />

  <!-- Outer App Window -->
  <g transform="translate(60, 45)">
    <rect width="1080" height="520" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#hubspotShadowBig)" />

    <!-- App Header Bar -->
    <rect width="1080" height="64" rx="16" fill="#f8fafc" />
    <rect y="50" width="1080" height="14" fill="#f8fafc" />
    <line x1="0" y1="64" x2="1080" y2="64" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- HubSpot Badge -->
    <g transform="translate(30, 16)">
      <rect width="160" height="32" rx="8" fill="#ff7a59" fill-opacity="0.12" stroke="#ff7a59" stroke-opacity="0.4" />
      <circle cx="18" cy="16" r="7" fill="#ff7a59" />
      <text x="36" y="22" fill="#c2410c" font-size="14" font-weight="800">HubSpot CRM</text>
    </g>

    <g transform="translate(730, 16)">
      <rect width="320" height="32" rx="8" fill="#ecfdf5" stroke="#a7f3d0" />
      <circle cx="18" cy="16" r="5" fill="#10b981" />
      <text x="32" y="22" fill="#047857" font-size="13" font-weight="800">2,500 Validated Leads • 0 Errors</text>
    </g>

    <!-- Table Header -->
    <g transform="translate(25, 85)">
      <rect width="1030" height="42" rx="8" fill="#f1f5f9" />
      <text x="25" y="27" fill="#475569" font-size="13" font-weight="800">CONTACT NAME</text>
      <text x="240" y="27" fill="#475569" font-size="13" font-weight="800">TITLE</text>
      <text x="500" y="27" fill="#475569" font-size="13" font-weight="800">COMPANY (CLEANED)</text>
      <text x="800" y="27" fill="#475569" font-size="13" font-weight="800">STATUS</text>
    </g>

    <!-- Row 1 -->
    <g transform="translate(25, 140)">
      <rect width="1030" height="58" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
      <text x="25" y="35" fill="#0f172a" font-size="17" font-weight="800">Greg Williams</text>
      <text x="240" y="35" fill="#334155" font-size="15" font-weight="600">VP of Supply Chain</text>
      <text x="500" y="35" fill="#0f172a" font-size="16" font-weight="800">Apex Freight Systems</text>
      
      <rect x="800" y="14" width="200" height="30" rx="15" fill="#ecfdf5" stroke="#a7f3d0" />
      <text x="900" y="34" fill="#047857" font-size="13" font-weight="800" text-anchor="middle">✓ Direct Dial Verified</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(25, 210)">
      <rect width="1030" height="58" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
      <text x="25" y="35" fill="#0f172a" font-size="17" font-weight="800">Sarah Campbell</text>
      <text x="240" y="35" fill="#334155" font-size="15" font-weight="600">Head of Operations</text>
      <text x="500" y="35" fill="#0f172a" font-size="16" font-weight="800">OmniTrack Logistics</text>
      
      <rect x="800" y="14" width="200" height="30" rx="15" fill="#ecfdf5" stroke="#a7f3d0" />
      <text x="900" y="34" fill="#047857" font-size="13" font-weight="800" text-anchor="middle">✓ SMTP Deliverable</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(25, 280)">
      <rect width="1030" height="58" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
      <text x="25" y="35" fill="#0f172a" font-size="17" font-weight="800">Michael Thornton</text>
      <text x="240" y="35" fill="#334155" font-size="15" font-weight="600">Chief Technology Officer</text>
      <text x="500" y="35" fill="#0f172a" font-size="16" font-weight="800">VectorScale Health</text>
      
      <rect x="800" y="14" width="200" height="30" rx="15" fill="#ecfdf5" stroke="#a7f3d0" />
      <text x="900" y="34" fill="#047857" font-size="13" font-weight="800" text-anchor="middle">✓ Direct Dial Verified</text>
    </g>

    <!-- Stat Highlights Bottom Bar -->
    <g transform="translate(25, 365)">
      <rect width="1030" height="110" rx="12" fill="#f8fafc" stroke="#e2e8f0" />
      
      <g transform="translate(50, 25)">
        <text x="0" y="20" fill="#64748b" font-size="13" font-weight="700">INGESTED LEADS</text>
        <text x="0" y="60" fill="#0f172a" font-size="34" font-weight="800">2,500</text>
      </g>

      <g transform="translate(360, 25)">
        <text x="0" y="20" fill="#64748b" font-size="13" font-weight="700">CLEANED NAMES</text>
        <text x="0" y="60" fill="#2563eb" font-size="34" font-weight="800">100.0%</text>
      </g>

      <g transform="translate(680, 25)">
        <text x="0" y="20" fill="#64748b" font-size="13" font-weight="700">BOUNCE RATE</text>
        <text x="0" y="60" fill="#10b981" font-size="34" font-weight="800">&lt; 1.5%</text>
      </g>
    </g>

  </g>
</svg>
