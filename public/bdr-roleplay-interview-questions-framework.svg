<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="shadowInterview" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap');
    text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="#ffffff" />
  <rect width="1200" height="6" fill="#2563eb" />

  <!-- Header Section -->
  <g transform="translate(60, 48)">
    <rect width="250" height="34" rx="17" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="125" y="23" fill="#1d4ed8" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1">BDR HIRING BENCHMARK</text>
    <text x="0" y="75" fill="#0f172a" font-size="32" font-weight="800">The 4 Core BDR Interview Roleplay Categories</text>
  </g>

  <!-- 4 Category Cards -->
  <g transform="translate(60, 155)">
    
    <!-- Category 1: Gatekeeper -->
    <g transform="translate(0, 0)">
      <rect width="250" height="390" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowInterview)" />
      <rect width="250" height="8" rx="4" fill="#3b82f6" />
      
      <circle cx="50" cy="50" r="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2" />
      <text x="50" y="57" fill="#1d4ed8" font-size="18" font-weight="800" text-anchor="middle">1</text>
      
      <text x="50" y="115" fill="#0f172a" font-size="20" font-weight="800">Gatekeeper</text>
      <text x="50" y="140" fill="#64748b" font-size="14" font-weight="600">Scenarios 1 - 7</text>

      <rect x="20" y="165" width="210" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="32" y="195" fill="#1e293b" font-size="13" font-weight="700">• "Who's calling?"</text>
      <text x="32" y="225" fill="#1e293b" font-size="13" font-weight="700">• "Is he expecting you?"</text>
      <text x="32" y="255" fill="#1e293b" font-size="13" font-weight="700">• "Send info to info@"</text>
      <text x="32" y="285" fill="#1e293b" font-size="13" font-weight="700">• "He's not available"</text>

      <rect x="20" y="330" width="210" height="38" rx="8" fill="#eff6ff" />
      <text x="125" y="354" fill="#1d4ed8" font-size="13" font-weight="800" text-anchor="middle">Neutral Tone &amp; Peer Status</text>
    </g>

    <!-- Category 2: Cold Openings -->
    <g transform="translate(276, 0)">
      <rect width="250" height="390" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowInterview)" />
      <rect width="250" height="8" rx="4" fill="#10b981" />
      
      <circle cx="50" cy="50" r="22" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2" />
      <text x="50" y="57" fill="#047857" font-size="18" font-weight="800" text-anchor="middle">2</text>
      
      <text x="50" y="115" fill="#0f172a" font-size="20" font-weight="800">Cold Openings</text>
      <text x="50" y="140" fill="#64748b" font-size="14" font-weight="600">Scenarios 8 - 14</text>

      <rect x="20" y="165" width="210" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="32" y="195" fill="#1e293b" font-size="13" font-weight="700">• "I'm in a meeting"</text>
      <text x="32" y="225" fill="#1e293b" font-size="13" font-weight="700">• "How did you get this?"</text>
      <text x="32" y="255" fill="#1e293b" font-size="13" font-weight="700">• "What is this about?"</text>
      <text x="32" y="285" fill="#1e293b" font-size="13" font-weight="700">• "Not interested"</text>

      <rect x="20" y="330" width="210" height="38" rx="8" fill="#ecfdf5" />
      <text x="125" y="354" fill="#047857" font-size="13" font-weight="800" text-anchor="middle">Permission-Based Openers</text>
    </g>

    <!-- Category 3: Objections -->
    <g transform="translate(552, 0)">
      <rect width="250" height="390" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowInterview)" />
      <rect width="250" height="8" rx="4" fill="#8b5cf6" />
      
      <circle cx="50" cy="50" r="22" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2" />
      <text x="50" y="57" fill="#6d28d9" font-size="18" font-weight="800" text-anchor="middle">3</text>
      
      <text x="50" y="115" fill="#0f172a" font-size="20" font-weight="800">Objections</text>
      <text x="50" y="140" fill="#64748b" font-size="14" font-weight="600">Scenarios 15 - 21</text>

      <rect x="20" y="165" width="210" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="32" y="195" fill="#1e293b" font-size="13" font-weight="700">• "Already have vendor"</text>
      <text x="32" y="225" fill="#1e293b" font-size="13" font-weight="700">• "No budget this quarter"</text>
      <text x="32" y="255" fill="#1e293b" font-size="13" font-weight="700">• "Send me an email"</text>
      <text x="32" y="285" fill="#1e293b" font-size="13" font-weight="700">• "Call me in 6 months"</text>

      <rect x="20" y="330" width="210" height="38" rx="8" fill="#f5f3ff" />
      <text x="125" y="354" fill="#6d28d9" font-size="13" font-weight="800" text-anchor="middle">Acknowledge &amp; Reframe</text>
    </g>

    <!-- Category 4: Voicemails -->
    <g transform="translate(828, 0)">
      <rect width="250" height="390" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowInterview)" />
      <rect width="250" height="8" rx="4" fill="#f59e0b" />
      
      <circle cx="50" cy="50" r="22" fill="#fffbeb" stroke="#fde68a" stroke-width="2" />
      <text x="50" y="57" fill="#b45309" font-size="18" font-weight="800" text-anchor="middle">4</text>
      
      <text x="50" y="115" fill="#0f172a" font-size="20" font-weight="800">Voicemails</text>
      <text x="50" y="140" fill="#64748b" font-size="14" font-weight="600">Scenarios 22 - 27</text>

      <rect x="20" y="165" width="210" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="32" y="195" fill="#1e293b" font-size="13" font-weight="700">• 20s Executive Drop</text>
      <text x="32" y="225" fill="#1e293b" font-size="13" font-weight="700">• Competitor Shift Drop</text>
      <text x="32" y="255" fill="#1e293b" font-size="13" font-weight="700">• Multi-Touch Follow-up</text>
      <text x="32" y="285" fill="#1e293b" font-size="13" font-weight="700">• Breakup Voicemail</text>

      <rect x="20" y="330" width="210" height="38" rx="8" fill="#fffbeb" />
      <text x="125" y="354" fill="#b45309" font-size="13" font-weight="800" text-anchor="middle">Short Curiosity Hooks</text>
    </g>

  </g>

  <!-- Footer -->
  <g transform="translate(60, 585)">
    <text x="0" y="0" fill="#64748b" font-size="14" font-weight="700">Willay Haider • B2B Sales Hiring &amp; Outbound Practice Guide</text>
    <text x="1080" y="0" fill="#2563eb" font-size="14" font-weight="800" text-anchor="end">willayhaider.pro</text>
  </g>
</svg>
