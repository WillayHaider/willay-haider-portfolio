<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap');
    text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Clean White Background -->
  <rect width="1200" height="700" fill="#ffffff" />
  <rect width="1200" height="8" fill="#2563eb" />

  <!-- Top Title Area -->
  <g transform="translate(60, 55)">
    <rect width="260" height="36" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
    <text x="130" y="24" fill="#1d4ed8" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1">BDR ROLEPLAY BLUEPRINT</text>
    <text x="0" y="85" fill="#0f172a" font-size="36" font-weight="800">4 Core Roleplay Categories Evaluated by Hiring Managers</text>
  </g>

  <!-- 4 Big Clean Columns (No nested box walls) -->
  <g transform="translate(60, 180)">
    
    <!-- Column 1: Gatekeeper Navigation -->
    <g transform="translate(0, 0)">
      <rect width="255" height="440" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
      <rect width="255" height="10" rx="5" fill="#2563eb" />
      
      <circle cx="48" cy="55" r="24" fill="#dbeafe" stroke="#93c5fd" stroke-width="2" />
      <text x="48" y="63" fill="#1e40af" font-size="22" font-weight="800" text-anchor="middle">1</text>
      
      <text x="90" y="52" fill="#0f172a" font-size="22" font-weight="800">Gatekeeper</text>
      <text x="90" y="74" fill="#64748b" font-size="16" font-weight="700">Questions 1 - 7</text>

      <text x="24" y="130" fill="#334155" font-size="17" font-weight="700">Scenarios Evaluated:</text>
      <text x="24" y="170" fill="#0f172a" font-size="18" font-weight="700">• "Who's calling?"</text>
      <text x="24" y="215" fill="#0f172a" font-size="18" font-weight="700">• "Are you expected?"</text>
      <text x="24" y="260" fill="#0f172a" font-size="18" font-weight="700">• "Send to info@"</text>
      <text x="24" y="305" fill="#0f172a" font-size="18" font-weight="700">• "He is not available"</text>

      <rect x="20" y="360" width="215" height="52" rx="10" fill="#dbeafe" />
      <text x="127" y="392" fill="#1e40af" font-size="15" font-weight="800" text-anchor="middle">Calm Peer Status</text>
    </g>

    <!-- Column 2: Cold Call Openings -->
    <g transform="translate(275, 0)">
      <rect width="255" height="440" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2" />
      <rect width="255" height="10" rx="5" fill="#16a34a" />
      
      <circle cx="48" cy="55" r="24" fill="#dcfce7" stroke="#86efac" stroke-width="2" />
      <text x="48" y="63" fill="#15803d" font-size="22" font-weight="800" text-anchor="middle">2</text>
      
      <text x="90" y="52" fill="#0f172a" font-size="22" font-weight="800">Cold Openings</text>
      <text x="90" y="74" fill="#64748b" font-size="16" font-weight="700">Questions 8 - 14</text>

      <text x="24" y="130" fill="#334155" font-size="17" font-weight="700">Scenarios Evaluated:</text>
      <text x="24" y="170" fill="#0f172a" font-size="18" font-weight="700">• "I'm in a meeting"</text>
      <text x="24" y="215" fill="#0f172a" font-size="18" font-weight="700">• "How did you get this?"</text>
      <text x="24" y="260" fill="#0f172a" font-size="18" font-weight="700">• "What is this about?"</text>
      <text x="24" y="305" fill="#0f172a" font-size="18" font-weight="700">• "Not interested"</text>

      <rect x="20" y="360" width="215" height="52" rx="10" fill="#dcfce7" />
      <text x="127" y="392" fill="#15803d" font-size="15" font-weight="800" text-anchor="middle">Permission Openers</text>
    </g>

    <!-- Column 3: Objection Handling -->
    <g transform="translate(550, 0)">
      <rect width="255" height="440" rx="18" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2" />
      <rect width="255" height="10" rx="5" fill="#9333ea" />
      
      <circle cx="48" cy="55" r="24" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="2" />
      <text x="48" y="63" fill="#7e22ce" font-size="22" font-weight="800" text-anchor="middle">3</text>
      
      <text x="90" y="52" fill="#0f172a" font-size="22" font-weight="800">Objections</text>
      <text x="90" y="74" fill="#64748b" font-size="16" font-weight="700">Questions 15 - 21</text>

      <text x="24" y="130" fill="#334155" font-size="17" font-weight="700">Scenarios Evaluated:</text>
      <text x="24" y="170" fill="#0f172a" font-size="18" font-weight="700">• "Already have vendor"</text>
      <text x="24" y="215" fill="#0f172a" font-size="18" font-weight="700">• "No budget left"</text>
      <text x="24" y="260" fill="#0f172a" font-size="18" font-weight="700">• "Send me an email"</text>
      <text x="24" y="305" fill="#0f172a" font-size="18" font-weight="700">• "Call in 6 months"</text>

      <rect x="20" y="360" width="215" height="52" rx="10" fill="#f3e8ff" />
      <text x="127" y="392" fill="#7e22ce" font-size="15" font-weight="800" text-anchor="middle">Acknowledge &amp; Reframe</text>
    </g>

    <!-- Column 4: Voicemails & Follow-Ups -->
    <g transform="translate(825, 0)">
      <rect width="255" height="440" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2" />
      <rect width="255" height="10" rx="5" fill="#d97706" />
      
      <circle cx="48" cy="55" r="24" fill="#fef3c7" stroke="#fcd34d" stroke-width="2" />
      <text x="48" y="63" fill="#b45309" font-size="22" font-weight="800" text-anchor="middle">4</text>
      
      <text x="90" y="52" fill="#0f172a" font-size="22" font-weight="800">Voicemails</text>
      <text x="90" y="74" fill="#64748b" font-size="16" font-weight="700">Questions 22 - 27</text>

      <text x="24" y="130" fill="#334155" font-size="17" font-weight="700">Scenarios Evaluated:</text>
      <text x="24" y="170" fill="#0f172a" font-size="18" font-weight="700">• 20s Curiosity Hook</text>
      <text x="24" y="215" fill="#0f172a" font-size="18" font-weight="700">• Competitor Benchmark</text>
      <text x="24" y="260" fill="#0f172a" font-size="18" font-weight="700">• Multi-Touch Text Sync</text>
      <text x="24" y="305" fill="#0f172a" font-size="18" font-weight="700">• Clean File Breakup</text>

      <rect x="20" y="360" width="215" height="52" rx="10" fill="#fef3c7" />
      <text x="127" y="392" fill="#b45309" font-size="15" font-weight="800" text-anchor="middle">High-Value Brevity</text>
    </g>

  </g>

  <!-- Bottom Branding -->
  <g transform="translate(60, 660)">
    <text x="0" y="0" fill="#64748b" font-size="15" font-weight="700">Willay Haider • Outbound Hiring &amp; Cold Calling Playbook</text>
    <text x="1080" y="0" fill="#2563eb" font-size="15" font-weight="800" text-anchor="end">willayhaider.pro</text>
  </g>
</svg>
