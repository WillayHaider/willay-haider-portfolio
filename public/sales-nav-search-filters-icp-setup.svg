<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="filterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c17" />
      <stop offset="50%" stop-color="#0d162a" />
      <stop offset="100%" stop-color="#060912" />
    </linearGradient>

    <linearGradient id="filterCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e36" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d1424" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
    text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#filterBg)" />

  <!-- Top Title -->
  <g transform="translate(60, 45)">
    <rect width="190" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" />
    <text x="95" y="17" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">ICP TARGETING ENGINE</text>
    <text x="0" y="58" fill="#ffffff" font-size="26" font-weight="800">Sales Navigator High-Converting Search Filter Matrix</text>
    <text x="0" y="82" fill="#94a3b8" font-size="13" font-weight="500">How to save ultra-targeted B2B search URLs for automated webhook lead ingestion.</text>
  </g>

  <!-- 3 ICP Configuration Columns -->
  <g transform="translate(60, 150)">
    
    <!-- Column 1: Account / Firmographic Filters -->
    <g transform="translate(0, 0)">
      <rect width="340" height="420" rx="14" fill="url(#filterCard)" stroke="#1e293b" stroke-width="1.5" />
      <rect width="340" height="6" rx="3" fill="#3b82f6" />
      <text x="24" y="38" fill="#ffffff" font-size="16" font-weight="700">1. Firmographic Filters</text>
      <text x="24" y="58" fill="#64748b" font-size="12" font-weight="600">COMPANY CRITERIA</text>

      <g transform="translate(20, 80)">
        <rect width="300" height="55" rx="8" fill="#090e1c" stroke="#1e293b" />
        <text x="16" y="24" fill="#94a3b8" font-size="11" font-weight="700">GEOGRAPHY</text>
        <text x="16" y="44" fill="#38bdf8" font-size="12" font-weight="600">United States, UK, Canada</text>
      </g>

      <g transform="translate(20, 150)">
        <rect width="300" height="55" rx="8" fill="#090e1c" stroke="#1e293b" />
        <text x="16" y="24" fill="#94a3b8" font-size="11" font-weight="700">COMPANY HEADCOUNT</text>
        <text x="16" y="44" fill="#38bdf8" font-size="12" font-weight="600">51-200 / 201-500 employees</text>
      </g>

      <g transform="translate(20, 220)">
        <rect width="300" height="55" rx="8" fill="#090e1c" stroke="#1e293b" />
        <text x="16" y="24" fill="#94a3b8" font-size="11" font-weight="700">INDUSTRY VERTICAL</text>
        <text x="16" y="44" fill="#38bdf8" font-size="12" font-weight="600">B2B SaaS, Logistics, Healthcare</text>
      </g>

      <g transform="translate(20, 290)">
        <rect width="300" height="55" rx="8" fill="#090e1c" stroke="#1e293b" />
        <text x="16" y="24" fill="#94a3b8" font-size="11" font-weight="700">ANNUAL REVENUE</text>
        <text x="16" y="44" fill="#38bdf8" font-size="12" font-weight="600">$5M - $50M ARR</text>
      </g>

      <text x="170" y="385" fill="#10b981" font-size="12" font-weight="700" text-anchor="middle">✓ Eliminates Unqualified Accounts</text>
    </g>

    <!-- Column 2: Lead / Persona Filters -->
    <g transform="translate(370, 0)">
      <rect width="340" height="420" rx="14" fill="url(#filterCard)" stroke="#1e293b" stroke-width="1.5" />
      <rect width="340" height="6" rx="3" fill="#10b981" />
      <text x="24" y="38" fill="#ffffff" font-size="16" font-weight="700">2. Persona &amp; Decision-Maker</text>
      <text x="24" y="58" fill="#64748b" font-size="12" font-weight="600">C-SUITE &amp; VP ROLES</text>

      <g transform="translate(20, 80)">
        <rect width="300" height="55" rx="8" fill="#090e1c" stroke="#1e293b" />
        <text x="16" y="24" fill="#94a3b8" font-size="11" font-weight="700">SENIORITY LEVEL</text>
        <text x="16" y="44" fill="#34d399" font-size="12" font-weight="600">VP, Director, CXO, Owner</text>
      </g>

      <g transform="translate(20, 150)">
        <rect width="300" height="55" rx="8" fill="#090e1c" stroke="#1e293b" />
        <text x="16" y="24" fill="#94a3b8" font-size="11" font-weight="700">CURRENT TITLE BOOLEAN</text>
        <text x="16" y="44" fill="#34d399" font-size="12" font-weight="600">"VP of Supply Chain" OR "Head of Ops"</text>
      </g>

      <g transform="translate(20, 220)">
        <rect width="300" height="55" rx="8" fill="#090e1c" stroke="#1e293b" />
        <text x="16" y="24" fill="#94a3b8" font-size="11" font-weight="700">YEARS IN CURRENT ROLE</text>
        <text x="16" y="44" fill="#34d399" font-size="12" font-weight="600">1 to 5+ Years (Established Budget)</text>
      </g>

      <g transform="translate(20, 290)">
        <rect width="300" height="55" rx="8" fill="#090e1c" stroke="#1e293b" />
        <text x="16" y="24" fill="#94a3b8" font-size="11" font-weight="700">FUNCTIONAL AREA</text>
        <text x="16" y="44" fill="#34d399" font-size="12" font-weight="600">Operations, Revenue, IT</text>
      </g>

      <text x="170" y="385" fill="#10b981" font-size="12" font-weight="700" text-anchor="middle">✓ Direct Buyer Authority Target</text>
    </g>

    <!-- Column 3: Saved Search URL Pipeline -->
    <g transform="translate(740, 0)">
      <rect width="340" height="420" rx="14" fill="url(#filterCard)" stroke="#1e293b" stroke-width="1.5" />
      <rect width="340" height="6" rx="3" fill="#8b5cf6" />
      <text x="24" y="38" fill="#ffffff" font-size="16" font-weight="700">3. Saved Search &amp; Webhook</text>
      <text x="24" y="58" fill="#64748b" font-size="12" font-weight="600">AUTOMATION INGESTION</text>

      <g transform="translate(20, 80)">
        <rect width="300" height="85" rx="8" fill="#090e1c" stroke="#1e293b" />
        <text x="16" y="24" fill="#c084fc" font-size="11" font-weight="700">SAVED SEARCH URL</text>
        <text x="16" y="45" fill="#94a3b8" font-size="10" class="mono">linkedin.com/sales/search/people</text>
        <text x="16" y="65" fill="#38bdf8" font-size="10" class="mono">?query=(filters:List((type:GEO...)))</text>
      </g>

      <g transform="translate(20, 180)">
        <rect width="300" height="85" rx="8" fill="#090e1c" stroke="#1e293b" />
        <text x="16" y="24" fill="#c084fc" font-size="11" font-weight="700">GOOGLE APPS SCRIPT PARSER</text>
        <text x="16" y="45" fill="#94a3b8" font-size="11">Iterates 25 profiles per page</text>
        <text x="16" y="65" fill="#10b981" font-size="11" font-weight="600">Sends JSON Webhook -> Sheets</text>
      </g>

      <g transform="translate(20, 280)">
        <rect width="300" height="65" rx="8" fill="#2563eb" fill-opacity="0.15" stroke="#3b82f6" />
        <text x="150" y="28" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">TOTAL PIPELINE RUNTIME</text>
        <text x="150" y="48" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">&lt; 15 mins for 100 Leads</text>
      </g>

      <text x="170" y="385" fill="#c084fc" font-size="12" font-weight="700" text-anchor="middle">✓ Automated Daily Refresh</text>
    </g>

  </g>

  <!-- Footer -->
  <g transform="translate(60, 615)">
    <text x="0" y="20" fill="#64748b" font-size="12" font-weight="600">B2B Outbound ICP Targeting Framework • Willay Haider</text>
    <text x="1080" y="20" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="end">willayhaider.pro</text>
  </g>
</svg>
