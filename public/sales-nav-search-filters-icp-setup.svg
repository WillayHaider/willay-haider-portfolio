<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="shadowCol" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap');
    text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" fill="#ffffff" />
  <rect width="1200" height="6" fill="#10b981" />

  <!-- Header -->
  <g transform="translate(60, 50)">
    <rect width="200" height="34" rx="17" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
    <text x="100" y="23" fill="#047857" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1">ICP SEARCH ENGINE</text>
    <text x="0" y="75" fill="#0f172a" font-size="34" font-weight="800">Sales Navigator High-Converting Filter Matrix</text>
  </g>

  <!-- 3 Big Columns -->
  <g transform="translate(60, 155)">
    
    <!-- Column 1: Firmographics -->
    <g transform="translate(0, 0)">
      <rect width="345" height="390" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowCol)" />
      <rect width="345" height="8" rx="4" fill="#3b82f6" />
      
      <text x="30" y="45" fill="#0f172a" font-size="22" font-weight="800">1. Firmographics</text>
      <text x="30" y="70" fill="#64748b" font-size="14" font-weight="600">COMPANY FILTERS</text>

      <g transform="translate(25, 95)">
        <rect width="295" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="18" y="24" fill="#64748b" font-size="12" font-weight="800">GEOGRAPHY</text>
        <text x="18" y="46" fill="#0f172a" font-size="16" font-weight="800">United States, UK, Canada</text>
      </g>

      <g transform="translate(25, 168)">
        <rect width="295" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="18" y="24" fill="#64748b" font-size="12" font-weight="800">HEADCOUNT</text>
        <text x="18" y="46" fill="#0f172a" font-size="16" font-weight="800">51 - 500 Employees</text>
      </g>

      <g transform="translate(25, 241)">
        <rect width="295" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="18" y="24" fill="#64748b" font-size="12" font-weight="800">INDUSTRY VERTICAL</text>
        <text x="18" y="46" fill="#0f172a" font-size="16" font-weight="800">B2B SaaS, Logistics, Health</text>
      </g>

      <rect x="25" y="325" width="295" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="172" y="351" fill="#1d4ed8" font-size="15" font-weight="800" text-anchor="middle">✓ Eliminates Waste Dials</text>
    </g>

    <!-- Column 2: Personas -->
    <g transform="translate(367, 0)">
      <rect width="345" height="390" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowCol)" />
      <rect width="345" height="8" rx="4" fill="#10b981" />
      
      <text x="30" y="45" fill="#0f172a" font-size="22" font-weight="800">2. Decision-Makers</text>
      <text x="30" y="70" fill="#64748b" font-size="14" font-weight="600">SENIORITY &amp; TITLES</text>

      <g transform="translate(25, 95)">
        <rect width="295" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="18" y="24" fill="#64748b" font-size="12" font-weight="800">SENIORITY LEVEL</text>
        <text x="18" y="46" fill="#0f172a" font-size="16" font-weight="800">VP, Director, CXO, Owner</text>
      </g>

      <g transform="translate(25, 168)">
        <rect width="295" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="18" y="24" fill="#64748b" font-size="12" font-weight="800">CURRENT TITLE</text>
        <text x="18" y="46" fill="#0f172a" font-size="16" font-weight="800">VP Supply Chain / Head Ops</text>
      </g>

      <g transform="translate(25, 241)">
        <rect width="295" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="18" y="24" fill="#64748b" font-size="12" font-weight="800">ROLE TENURE</text>
        <text x="18" y="46" fill="#0f172a" font-size="16" font-weight="800">1+ Years (Budget Authority)</text>
      </g>

      <rect x="25" y="325" width="295" height="42" rx="8" fill="#ecfdf5" stroke="#a7f3d0" />
      <text x="172" y="351" fill="#047857" font-size="15" font-weight="800" text-anchor="middle">✓ Direct Budget Authority</text>
    </g>

    <!-- Column 3: Automated Ingestion -->
    <g transform="translate(735, 0)">
      <rect width="345" height="390" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadowCol)" />
      <rect width="345" height="8" rx="4" fill="#8b5cf6" />
      
      <text x="30" y="45" fill="#0f172a" font-size="22" font-weight="800">3. Saved Search &amp; CRM</text>
      <text x="30" y="70" fill="#64748b" font-size="14" font-weight="600">AUTOMATED WORKFLOW</text>

      <g transform="translate(25, 95)">
        <rect width="295" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="18" y="24" fill="#6d28d9" font-size="12" font-weight="800">SAVED SEARCH URL</text>
        <text x="18" y="46" fill="#0f172a" font-size="16" font-weight="800">Named ICP Target Query</text>
      </g>

      <g transform="translate(25, 168)">
        <rect width="295" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="18" y="24" fill="#6d28d9" font-size="12" font-weight="800">DATA NORMALIZATION</text>
        <text x="18" y="46" fill="#0f172a" font-size="16" font-weight="800">RegEx Cleaning in Sheets</text>
      </g>

      <g transform="translate(25, 241)">
        <rect width="295" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="18" y="24" fill="#6d28d9" font-size="12" font-weight="800">DIRECT CRM SYNC</text>
        <text x="18" y="46" fill="#0f172a" font-size="16" font-weight="800">HubSpot &amp; Salesforce Ready</text>
      </g>

      <rect x="25" y="325" width="295" height="42" rx="8" fill="#f5f3ff" stroke="#ddd6fe" />
      <text x="172" y="351" fill="#6d28d9" font-size="15" font-weight="800" text-anchor="middle">✓ Automated Daily Feed</text>
    </g>

  </g>

  <!-- Footer -->
  <g transform="translate(60, 585)">
    <text x="0" y="0" fill="#64748b" font-size="14" font-weight="700">Willay Haider • ICP Targeting Framework</text>
    <text x="1080" y="0" fill="#10b981" font-size="14" font-weight="800" text-anchor="end">willayhaider.pro</text>
  </g>
</svg>
