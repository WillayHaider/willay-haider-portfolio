<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="whiteFilterShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
    text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>

  <!-- Background Canvas: Clean Crisp White -->
  <rect width="1200" height="630" fill="#ffffff" />
  <rect width="1200" height="4" fill="#10b981" />

  <!-- Top Title -->
  <g transform="translate(60, 45)">
    <rect width="190" height="26" rx="13" fill="#ecfdf5" stroke="#a7f3d0" />
    <text x="95" y="17" fill="#047857" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">ICP TARGETING ENGINE</text>
    <text x="0" y="58" fill="#0f172a" font-size="26" font-weight="800">Sales Navigator High-Converting Search Filter Matrix</text>
    <text x="0" y="82" fill="#64748b" font-size="13" font-weight="500">How to configure ultra-targeted B2B search parameters for compliant lead list generation.</text>
  </g>

  <!-- 3 ICP Configuration Columns -->
  <g transform="translate(60, 150)">
    
    <!-- Column 1: Account / Firmographic Filters -->
    <g transform="translate(0, 0)">
      <rect width="340" height="395" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#whiteFilterShadow)" />
      <rect width="340" height="5" rx="2.5" fill="#3b82f6" />
      <text x="24" y="36" fill="#0f172a" font-size="16" font-weight="700">1. Firmographic Filters</text>
      <text x="24" y="56" fill="#64748b" font-size="11" font-weight="600">COMPANY CRITERIA</text>

      <g transform="translate(20, 75)">
        <rect width="300" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="16" y="22" fill="#64748b" font-size="10" font-weight="700">GEOGRAPHY</text>
        <text x="16" y="40" fill="#0f172a" font-size="12" font-weight="600">United States, UK, Canada</text>
      </g>

      <g transform="translate(20, 140)">
        <rect width="300" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="16" y="22" fill="#64748b" font-size="10" font-weight="700">COMPANY HEADCOUNT</text>
        <text x="16" y="40" fill="#0f172a" font-size="12" font-weight="600">51-200 / 201-500 employees</text>
      </g>

      <g transform="translate(20, 205)">
        <rect width="300" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="16" y="22" fill="#64748b" font-size="10" font-weight="700">INDUSTRY VERTICAL</text>
        <text x="16" y="40" fill="#0f172a" font-size="12" font-weight="600">B2B SaaS, Logistics, Healthcare</text>
      </g>

      <g transform="translate(20, 270)">
        <rect width="300" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="16" y="22" fill="#64748b" font-size="10" font-weight="700">ANNUAL REVENUE</text>
        <text x="16" y="40" fill="#0f172a" font-size="12" font-weight="600">$5M - $50M ARR</text>
      </g>

      <text x="170" y="360" fill="#047857" font-size="12" font-weight="700" text-anchor="middle">✓ Eliminates Unqualified Accounts</text>
    </g>

    <!-- Column 2: Lead / Persona Filters -->
    <g transform="translate(370, 0)">
      <rect width="340" height="395" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#whiteFilterShadow)" />
      <rect width="340" height="5" rx="2.5" fill="#10b981" />
      <text x="24" y="36" fill="#0f172a" font-size="16" font-weight="700">2. Persona &amp; Decision-Maker</text>
      <text x="24" y="56" fill="#64748b" font-size="11" font-weight="600">C-SUITE &amp; VP ROLES</text>

      <g transform="translate(20, 75)">
        <rect width="300" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="16" y="22" fill="#64748b" font-size="10" font-weight="700">SENIORITY LEVEL</text>
        <text x="16" y="40" fill="#0f172a" font-size="12" font-weight="600">VP, Director, CXO, Owner</text>
      </g>

      <g transform="translate(20, 140)">
        <rect width="300" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="16" y="22" fill="#64748b" font-size="10" font-weight="700">CURRENT TITLE BOOLEAN</text>
        <text x="16" y="40" fill="#0f172a" font-size="12" font-weight="600">"VP of Supply Chain" OR "Head of Ops"</text>
      </g>

      <g transform="translate(20, 205)">
        <rect width="300" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="16" y="22" fill="#64748b" font-size="10" font-weight="700">YEARS IN CURRENT ROLE</text>
        <text x="16" y="40" fill="#0f172a" font-size="12" font-weight="600">1 to 5+ Years (Established Budget)</text>
      </g>

      <g transform="translate(20, 270)">
        <rect width="300" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="16" y="22" fill="#64748b" font-size="10" font-weight="700">FUNCTIONAL AREA</text>
        <text x="16" y="40" fill="#0f172a" font-size="12" font-weight="600">Operations, Revenue, IT</text>
      </g>

      <text x="170" y="360" fill="#047857" font-size="12" font-weight="700" text-anchor="middle">✓ Direct Buyer Authority Target</text>
    </g>

    <!-- Column 3: Saved Search URL Pipeline -->
    <g transform="translate(740, 0)">
      <rect width="340" height="395" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#whiteFilterShadow)" />
      <rect width="340" height="5" rx="2.5" fill="#8b5cf6" />
      <text x="24" y="36" fill="#0f172a" font-size="16" font-weight="700">3. Saved Search &amp; CRM Sync</text>
      <text x="24" y="56" fill="#64748b" font-size="11" font-weight="600">AUTOMATED INGESTION</text>

      <g transform="translate(20, 75)">
        <rect width="300" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="16" y="22" fill="#6d28d9" font-size="10" font-weight="700">SAVED SEARCH URL</text>
        <text x="16" y="42" fill="#64748b" font-size="10" class="mono">linkedin.com/sales/search/people</text>
        <text x="16" y="60" fill="#2563eb" font-size="10" class="mono">?query=(filters:List((type:GEO...)))</text>
      </g>

      <g transform="translate(20, 165)">
        <rect width="300" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
        <text x="16" y="22" fill="#6d28d9" font-size="10" font-weight="700">GOOGLE SHEETS CLEANING</text>
        <text x="16" y="42" fill="#64748b" font-size="11">Automated RegEx normalization</text>
        <text x="16" y="60" fill="#047857" font-size="11" font-weight="600">Pushes directly to HubSpot / Sheets</text>
      </g>

      <g transform="translate(20, 255)">
        <rect width="300" height="60" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
        <text x="150" y="26" fill="#1d4ed8" font-size="10" font-weight="700" text-anchor="middle">TOTAL PIPELINE VELOCITY</text>
        <text x="150" y="45" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">100% Policy-Safe &amp; Verified</text>
      </g>

      <text x="170" y="360" fill="#6d28d9" font-size="12" font-weight="700" text-anchor="middle">✓ Automated Daily Refresh</text>
    </g>

  </g>

  <!-- Footer -->
  <g transform="translate(60, 580)">
    <text x="0" y="0" fill="#64748b" font-size="12" font-weight="600">B2B Outbound ICP Targeting Framework • Willay Haider</text>
    <text x="1080" y="0" fill="#2563eb" font-size="12" font-weight="700" text-anchor="end">willayhaider.pro</text>
  </g>
</svg>
