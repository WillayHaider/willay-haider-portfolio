<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background:#FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Top Title Bar -->
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="170" height="28" rx="14" fill="#EFF6FF" />
    <text x="85" y="19" text-anchor="middle" font-size="13" font-weight="800" fill="#2563EB" letter-spacing="0.5">OUTBOUND PLAYBOOK</text>
    <text x="0" y="66" font-size="30" font-weight="900" fill="#0F172A">4-Step Founder Cold Call Architecture</text>
    <text x="0" y="94" font-size="16" font-weight="600" fill="#64748B">How to pitch growth services to startup founders without triggering sales resistance</text>
  </g>

  <!-- 4 Step Cards (2x2 Grid with Extra-Large High-Contrast Text) -->
  <g transform="translate(40, 155)">
    <!-- STEP 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="425" height="195" rx="16" fill="#F8FAFC" />
      <rect x="18" y="18" width="38" height="38" rx="10" fill="url(#blueGrad)" />
      <text x="37" y="44" text-anchor="middle" font-size="20" font-weight="900" fill="#FFFFFF">1</text>
      <text x="68" y="32" font-size="12" font-weight="800" fill="#2563EB" letter-spacing="0.5">SECONDS 0 - 10</text>
      <text x="68" y="52" font-size="18" font-weight="800" fill="#0F172A">Permission Opener</text>
      <text x="18" y="82" font-size="13" font-weight="700" fill="#475569">Goal: Acknowledge interruption &amp; transfer control</text>
      
      <rect x="18" y="96" width="389" height="82" rx="10" fill="#FFFFFF" />
      <text x="30" y="122" font-size="14" font-weight="700" fill="#0F172A">&quot;Hey Alex, Willay here. I know I caught you</text>
      <text x="30" y="144" font-size="14" font-weight="700" fill="#0F172A">out of the blue. Do you have 30 seconds to</text>
      <text x="30" y="166" font-size="14" font-weight="800" fill="#2563EB">hear why I called, or should you hang up?&quot;</text>
    </g>

    <!-- STEP 2 -->
    <g transform="translate(455, 0)">
      <rect x="0" y="0" width="425" height="195" rx="16" fill="#F8FAFC" />
      <rect x="18" y="18" width="38" height="38" rx="10" fill="url(#blueGrad)" />
      <text x="37" y="44" text-anchor="middle" font-size="20" font-weight="900" fill="#FFFFFF">2</text>
      <text x="68" y="32" font-size="12" font-weight="800" fill="#2563EB" letter-spacing="0.5">SECONDS 10 - 25</text>
      <text x="68" y="52" font-size="18" font-weight="800" fill="#0F172A">ICP Pain Anchor</text>
      <text x="18" y="82" font-size="13" font-weight="700" fill="#475569">Goal: Reference peer bottlenecks (CAC &amp; drop-off)</text>
      
      <rect x="18" y="96" width="389" height="82" rx="10" fill="#FFFFFF" />
      <text x="30" y="122" font-size="14" font-weight="700" fill="#0F172A">&quot;We speak with SaaS founders burning $10k/mo</text>
      <text x="30" y="144" font-size="14" font-weight="700" fill="#0F172A">on ads while demo conversions stall because</text>
      <text x="30" y="166" font-size="14" font-weight="800" fill="#2563EB">messaging fails to reach economic buyers.&quot;</text>
    </g>

    <!-- STEP 3 -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="425" height="195" rx="16" fill="#F8FAFC" />
      <rect x="18" y="18" width="38" height="38" rx="10" fill="url(#blueGrad)" />
      <text x="37" y="44" text-anchor="middle" font-size="20" font-weight="900" fill="#FFFFFF">3</text>
      <text x="68" y="32" font-size="12" font-weight="800" fill="#2563EB" letter-spacing="0.5">SECONDS 25 - 45</text>
      <text x="68" y="52" font-size="18" font-weight="800" fill="#0F172A">Diagnostic Hook</text>
      <text x="18" y="82" font-size="13" font-weight="700" fill="#475569">Goal: Ask an open-ended funnel diagnostic question</text>
      
      <rect x="18" y="96" width="389" height="82" rx="10" fill="#FFFFFF" />
      <text x="30" y="122" font-size="14" font-weight="700" fill="#0F172A">&quot;Curious: how is your team currently</text>
      <text x="30" y="144" font-size="14" font-weight="700" fill="#0F172A">approaching converting outbound traffic</text>
      <text x="30" y="166" font-size="14" font-weight="800" fill="#2563EB">into qualified executive discovery calls?&quot;</text>
    </g>

    <!-- STEP 4 -->
    <g transform="translate(455, 215)">
      <rect x="0" y="0" width="425" height="195" rx="16" fill="#F0FDF4" />
      <rect x="18" y="18" width="38" height="38" rx="10" fill="url(#greenGrad)" />
      <text x="37" y="44" text-anchor="middle" font-size="20" font-weight="900" fill="#FFFFFF">4</text>
      <text x="68" y="32" font-size="12" font-weight="800" fill="#15803D" letter-spacing="0.5">SECONDS 45 - 60</text>
      <text x="68" y="52" font-size="18" font-weight="800" fill="#064E3B">Low-Friction Close</text>
      <text x="18" y="82" font-size="13" font-weight="700" fill="#15803D">Goal: Trade a free 15-min teardown for meeting</text>
      
      <rect x="18" y="96" width="389" height="82" rx="10" fill="#FFFFFF" />
      <text x="30" y="122" font-size="14" font-weight="700" fill="#0F172A">&quot;I am not asking you to buy anything today.</text>
      <text x="30" y="144" font-size="14" font-weight="700" fill="#0F172A">How about 15 min Thursday to see our teardown</text>
      <text x="30" y="166" font-size="14" font-weight="800" fill="#15803D">notes? Would morning or afternoon work?&quot;</text>
    </g>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(40, 590)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#64748B">Willay Haider | Senior Outbound Sales Specialist (57,000+ Dials)</text>
    <text x="880" y="0" text-anchor="end" font-size="13" font-weight="800" fill="#2563EB">willayhaider.pro</text>
  </g>
</svg>
